# Controlli automatici: girano su ogni pull request, su ogni push su main e su ogni tag di versione.
# Se uno di questi passi fallisce, la PR mostra una X rossa e non andrebbe unita.
# Su un tag vX.Y.Z, se i controlli passano, parte anche il deploy in produzione.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

# Se arrivano nuovi commit sulla stessa PR, il controllo precedente viene annullato.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipi, test e build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installa le dipendenze (dal lockfile)
        run: npm ci

      - name: Controllo dei tipi (web, api, shared)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formattazione (Prettier)
        run: npm run format:check

      - name: Test delle API
        run: npm test

      - name: Build di produzione del frontend
        run: npm run build

  deploy-production:
    name: Deploy in produzione
    # Solo per i tag di versione, e solo se tutti i controlli sopra sono passati.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # L'ambiente "production" di GitHub custodisce il segreto e tiene lo storico dei rilasci.
    environment:
      name: production
      url: https://discoverevent.onrender.com

    steps:
      - name: Avvia il deploy su Render del commit del tag
        env:
          # L'indirizzo del deploy hook è un segreto: chi lo conosce può far partire un deploy.
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error -X POST "$DEPLOY_HOOK&ref=$GITHUB_SHA"

  github-release:
    name: Release su GitHub
    # Dopo il deploy: la pagina Releases del repository mostra la versione con le sue novità.
    needs: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Creare una release richiede il permesso di scrittura sul repository, solo per questo job.
    permissions:
      contents: write

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Crea la release con la sezione del CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Le righe tra "## [X.Y.Z]" e la sezione successiva (o i link in fondo al file).
          awk -v v="$version" 'index($0, "## [" v "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[.+\]: /) { exit }
            found { print }' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::Nel CHANGELOG manca la sezione [$version]"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --title "DiscoverEvent $version" --notes-file notes.md --verify-tag
