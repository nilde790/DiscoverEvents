<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Sei offline · DiscoverEvent</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: system-ui, sans-serif;
        background: #f5f6fb;
        color: #1f2937;
        text-align: center;
      }
      a {
        display: inline-block;
        margin-top: 8px;
        padding: 10px 20px;
        border-radius: 10px;
        background: #4f46e5;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0b1020;
          color: #e5e7eb;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <!-- Icona dentro la pagina: senza rete non si può scaricare, e il service worker salva solo questo file. -->
      <svg width="64" height="64" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#4f46e5" />
        <path
          transform="translate(4 4)"
          fill="#fff"
          d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"
        />
      </svg>
      <h1>Sei offline</h1>
      <p>DiscoverEvent ha bisogno di internet per mostrarti gli eventi.<br />Controlla la connessione e riprova.</p>
      <a href="/">Riprova</a>
    </main>
  </body>
</html>
